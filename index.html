<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSO - Menú de Ejercicios</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0f1117;
            color: #cbd5e1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .hub-card {
            background: #181b24;
            border: 1px solid #2e3447;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: inline-block;
        }

        h1 {
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exercise-btn {
            background: #212532;
            border: 1px solid #2e3447;
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.98rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .exercise-btn:hover {
            background: #6366f1;
            border-color: #818cf8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.25);
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="hub-card">
    <div class="header-icon">🚀</div>
    <h1>UPSO Studio</h1>
    <p>Selecciona la guía de trabajos prácticos que deseas visualizar:</p>
    
    <div id="btn-container" class="btn-container">
        <!-- Lista por defecto para que NUNCA aparezca la pantalla en blanco -->
        <a href="./ejercicio5/" class="exercise-btn">
            <span>📁 Ejercicio 5</span>
            <span class="badge">Abrir ↗</span>
        </a>
        <a href="./ejercicio6/" class="exercise-btn">
            <span>📁 Ejercicio 6</span>
            <span class="badge">Abrir ↗</span>
        </a>
    </div>
</div>

<script>
    const USER = 'enegdev';
    const REPO = 'UPSO_Ejercicio_6';

    async function cargarEjerciciosDinamicos() {
        const container = document.getElementById('btn-container');
        try {
            const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents`);
            if (!response.ok) return; // Si falla la API, conserva los botones fijos por defecto

            const items = await response.json();
            const carpetas = items.filter(item => item.type === 'dir' && item.name.toLowerCase().startsWith('ejercicio'));

            if (carpetas.length > 0) {
                carpetas.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
                container.innerHTML = ''; // Limpia y dibuja la lista dinamica si la API responde con exito

                carpetas.forEach(folder => {
                    const link = document.createElement('a');
                    link.href = `./${folder.name}/`;
                    link.className = 'exercise-btn';

                    const textoFormateado = folder.name.replace(/([a-zA-Z]+)(\d+)/, (m, p1, p2) => {
                        return p1.charAt(0).toUpperCase() + p1.slice(1) + ' ' + p2;
                    });

                    link.innerHTML = `
                        <span>📁 ${textoFormateado}</span>
                        <span class="badge">Abrir ↗</span>
                    `;
                    container.appendChild(link);
                });
            }
        } catch (error) {
            console.warn("Usando lista estática de respaldo:", error);
        }
    }

    cargarEjerciciosDinamicos();
</script>

</body>
</html>
