<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSO - Menú de Ejercicios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0f1117;
            color: #cbd5e1;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .hub-card {
            background: #181b24;
            border: 1px solid #2e3447;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: inline-block;
        }

        h1 {
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exercise-btn {
            background: #212532;
            border: 1px solid #2e3447;
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.98rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .exercise-btn:hover {
            background: #6366f1;
            border-color: #818cf8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.25);
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .state-msg {
            color: #64748b;
            font-size: 0.9rem;
            padding: 20px;
            background: #13151f;
            border-radius: 8px;
            border: 1px dashed #2e3447;
        }
    </style>
</head>
<body>

<div class="hub-card">
    <div class="header-icon">🚀</div>
    <h1>UPSO Studio</h1>
    <p>Selecciona la guía de trabajos prácticos que deseas visualizar:</p>
    
    <div id="btn-container" class="btn-container">
        <div class="state-msg">Cargando ejercicios disponibles... 🔄</div>
    </div>
</div>

<script>
    const USER = 'enegdev';
    const REPO = 'UPSO_Ejercicio_6';

    async function cargarEjerciciosDinamicos() {
        const container = document.getElementById('btn-container');
        try {
            const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents`);
            
            if (!response.ok) {
                throw new Error('Error al conectar con GitHub');
            }

            const items = await response.json();

            // Filtrar solo las carpetas que inicien con "ejercicio"
            const carpetas = items.filter(item => item.type === 'dir' && item.name.toLowerCase().startsWith('ejercicio'));

            container.innerHTML = '';

            if (carpetas.length === 0) {
                container.innerHTML = '<div class="state-msg">No se encontraron carpetas de ejercicios aún.</div>';
                return;
            }

            // Ordenar carpetas numéricamente (ejercicio5, ejercicio6, ejercicio7...)
            carpetas.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

            // Generar los botones automáticamente
            carpetas.forEach(folder => {
                const link = document.createElement('a');
                link.href = `./${folder.name}/`;
                link.className = 'exercise-btn';

                // Formatear texto visual (ej: "ejercicio5" -> "Ejercicio 5")
                const textoFormateado = folder.name.replace(/([a-zA-Z]+)(\d+)/, (match, p1, p2) => {
                    return p1.charAt(0).toUpperCase() + p1.slice(1) + ' ' + p2;
                });

                link.innerHTML = `
                    <span>📁 ${textoFormateado}</span>
                    <span class="badge">Abrir ↗</span>
                `;
                container.appendChild(link);
            });

        } catch (error) {
            console.error(error);
            container.innerHTML = '<div class="state-msg">⚠️ No se pudieron cargar los ejercicios dinámicamente.</div>';
        }
    }

    cargarEjerciciosDinamicos();
</script>

</body>
</html>
